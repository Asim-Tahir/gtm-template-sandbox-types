name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version type to bump"
        required: true
        type: choice
        default: "patch"
        options:
          - patch
          - minor
          - major
      skip_tag:
        description: "Skip adding git tag to the version bump commit"
        required: false
        type: boolean
        default: false
      skip_commit:
        description: "Skip committing the version bump"
        required: false
        type: boolean
        default: false
      skip_push:
        description: "Skip pushing any commits or tags created after the version bump"
        required: false
        type: boolean
        default: false
      generate_release_notes:
        description: "Generate release notes for the GitHub Release"
        required: false
        type: boolean
        default: true

env:
  HUSKY: 0

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Current Version
        id: current_version
        run: echo "version=$(bun pm pkg get version)" >> "$GITHUB_OUTPUT"

      - name: Configure Git Identity
        if: ${{ !inputs.skip_commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump Version
        id: bump_version
        run: |
          bun pm version "${{ inputs.version_type }}" \
            --no-git-tag-version \
            --message="ci: bump version to \`%s\`"

      - name: New Version
        id: new_version
        run: echo "version=$(bun pm pkg get version)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Generate SBOM
        run: npm sbom --sbom-format spdx > sbom.spdx.json

      - name: GitHub Attestation
        uses: actions/attest@v4
        with:
          subject-path: "${{ github.workspace }}"
          sbom-path: "${{ github.workspace }}/sbom.spdx.json"

      - name: Finalize Version Bump
        run: |
          if [ "${{ inputs.skip_commit }}" != "true" ]; then
            git add package.json
            git commit -m "ci: bump version to \`${{ steps.new_version.outputs.version }}\`" || echo "No version files to commit"
          fi

          if [ "${{ inputs.skip_tag }}" != "true" ]; then
            TAG="v${{ steps.new_version.outputs.version }}"
            git rev-parse "$TAG" >/dev/null 2>&1 || git tag "$TAG"
          fi

          if [ "${{ inputs.skip_push }}" != "true" ]; then
            git push origin HEAD:${{ github.ref_name }}

            if [ "${{ inputs.skip_tag }}" != "true" ]; then
              git push origin "v${{ steps.new_version.outputs.version }}"
            fi
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV_VERSION: ${{ steps.current_version.outputs.version }}
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
          TAG: "v${{ steps.new_version.outputs.version }}"
          REPO_URL: "https://github.com/${{ github.repository }}"
        run: |
          awk -v ver="$NEW_VERSION" '
            index($0, "## [" ver "]") == 1 { in_section = 1; next }
            in_section && index($0, "## [") == 1 { in_section = 0 }
            in_section { lines[++n] = $0 }
            END {
              for (i = 1; i <= n; i++) {
                if (lines[i] !~ /^[[:space:]]*$/) {
                  first = i
                  break
                }
              }
              for (i = n; i >= 1; i--) {
                if (lines[i] !~ /^[[:space:]]*$/) {
                  last = i
                  break
                }
              }
              if (first && last) {
                for (i = first; i <= last; i++) {
                  print lines[i]
                }
              }
            }
          ' CHANGELOG.md > release-notes.md

          if [ -n "$(tr -d '[:space:]' < release-notes.md)" ]; then
            if [ -n "$PREV_VERSION" ]; then
              printf '\n**Full Changelog**: %s/compare/v%s...v%s\n' "$REPO_URL" "$PREV_VERSION" "$NEW_VERSION" >> release-notes.md
            fi
            release_args=(--notes-file release-notes.md)
          elif [ "${{ inputs.generate_release_notes }}" = "true" ]; then
            rm -f release-notes.md
            release_args=(--generate-notes)
          else
            rm -f release-notes.md
            release_args=(--notes "$TAG")
          fi

          gh release create "$TAG" --verify-tag "${release_args[@]}"

      - name: Setup authentication for GitHub Packages registry
        run: |
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> .npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the library
        run: bun run build

      - name: Publish to GitHub Packages
        run: npm publish --registry https://npm.pkg.github.com --access public --tag latest --provenance

      - name: Publish to NPM
        run: npm publish --registry https://registry.npmjs.org --access public --tag latest --provenance
