name: Pre Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version type to bump\n\nprerelease 0.0.1-alpha.11 → 0.0.1-alpha.12\nprepatch   0.0.1-alpha.11 → 0.0.2-alpha.0\npreminor   0.0.1-alpha.11 → 0.1.0-alpha.0\npremajor   0.0.1-alpha.11 → 1.0.0-alpha.0"
        required: true
        type: choice
        default: "prerelease"
        options:
          - prerelease # 0.0.1-alpha.11 → 0.0.1-alpha.12
          - prepatch # 0.0.1-alpha.11 → 0.0.2-alpha.0
          - preminor # 0.0.1-alpha.11 → 0.1.0-alpha.0
          - premajor # 0.0.1-alpha.11 → 1.0.0-alpha.0
      pre_id:
        description: "Pre-release identifier"
        required: true
        type: choice
        default: "alpha"
        options:
          - alpha
          - beta
          - rc
      skip_tag:
        description: "Skip adding git tag to the version bump commit"
        required: false
        type: boolean
        default: false
      skip_commit:
        description: "Skip committing the version bump"
        required: false
        type: boolean
        default: false
      skip_push:
        description: "Skip pushing any commits or tags created after the version bump"
        required: false
        type: boolean
        default: false
      generate_release_notes:
        description: "Generate release notes for the GitHub Release"
        required: false
        type: boolean
        default: true

env:
  HUSKY: 0

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  bump_version:
    name: Bump Version
    uses: ./.github/workflows/bump-version.yml
    with:
      version_type: ${{ inputs.version_type }}
      pre_id: ${{ inputs.pre_id }}
      skip_tag: ${{ inputs.skip_tag }}
      skip_commit: ${{ inputs.skip_commit }}
      skip_push: ${{ inputs.skip_push }}
        
  prepublish:
    name: Prepublish
    needs: bump_version
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Generate SBOM
        run: npm sbom --sbom-format spdx > sbom.spdx.json

      - name: GitHub Attestation
        uses: actions/attest@v4
        with:
          subject-path: "${{ github.workspace }}"
          sbom-path: "${{ github.workspace }}/sbom.spdx.json"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV_VERSION: ${{ needs.bump_version.outputs.current_version }}
          NEW_VERSION: ${{ needs.bump_version.outputs.new_version }}
          TAG: "v${{ needs.bump_version.outputs.new_version }}"
          REPO_URL: "https://github.com/${{ github.repository }}"
        run: |
          awk -v ver="$NEW_VERSION" '
            index($0, "## [" ver "]") == 1 { in_section = 1; next }
            in_section && index($0, "## [") == 1 { in_section = 0 }
            in_section { lines[++n] = $0 }
            END {
              for (i = 1; i <= n; i++) {
                if (lines[i] !~ /^[[:space:]]*$/) {
                  first = i
                  break
                }
              }
              for (i = n; i >= 1; i--) {
                if (lines[i] !~ /^[[:space:]]*$/) {
                  last = i
                  break
                }
              }
              if (first && last) {
                for (i = first; i <= last; i++) {
                  print lines[i]
                }
              }
            }
          ' CHANGELOG.md > release-notes.md

          if [ -n "$(tr -d '[:space:]' < release-notes.md)" ]; then
            if [ -n "$PREV_VERSION" ]; then
              printf '\n**Full Changelog**: %s/compare/v%s...v%s\n' "$REPO_URL" "$PREV_VERSION" "$NEW_VERSION" >> release-notes.md
            fi
            release_args=(--notes-file release-notes.md)
          elif [ "${{ inputs.generate_release_notes }}" = "true" ]; then
            rm -f release-notes.md
            release_args=(--generate-notes)
          else
            rm -f release-notes.md
            release_args=(--notes "$TAG")
          fi

          gh release create "$TAG" "${release_args[@]}"

      - name: Setup authentication for GitHub Packages registry
        run: |
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> .npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish to GitHub Packages
        run: npm publish --registry https://npm.pkg.github.com --access public --tag latest --provenance

      - name: Publish to NPM
        run: npm publish --registry https://registry.npmjs.org --access public --tag latest --provenance
